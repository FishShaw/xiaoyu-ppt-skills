name: Release draft
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: release
  cancel-in-progress: false
jobs:
  release:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Require successful main CI for this exact commit
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          python scripts/check_release_ci.py
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Recheck current advisories and exception expiry before release
        run: python scripts/audit_dependencies.py
      - run: python scripts/check_repo.py
      - run: python scripts/package_skill.py
      - name: Create an immutable versioned release draft
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          TAG=$(python -c 'import json; print("v"+json.load(open("dist/manifest.json"))["version"])')
          if git ls-remote --exit-code --tags origin "refs/tags/$TAG"; then
            echo "Version already tagged. Bump the skill version through a PR."
            exit 1
          else
            code=$?
            test "$code" = 2
          fi
          gh release create "$TAG" dist/xiaoyu-ppt.skill dist/manifest.json --repo "$REPO" --target "$SHA" --draft --title "xiaoyu-ppt $TAG" --notes "Built from tested main commit $SHA. Verify manifest.json and inspect preview artifacts before publishing."
