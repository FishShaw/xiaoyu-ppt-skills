name: Release draft
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: release
  cancel-in-progress: false
jobs:
  release:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Require successful main CI for this exact commit
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          gh api "repos/$REPO/actions/workflows/ci.yml/runs?head_sha=$SHA&event=push&status=success&per_page=100" --jq '.workflow_runs[] | select(.head_branch == "main") | .head_sha' | grep -Fx "$SHA"
      - run: python scripts/check_repo.py
      - run: python scripts/package_skill.py
      - name: Create an immutable versioned release draft
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          TAG=$(python -c 'import json; print("v"+json.load(open("dist/manifest.json"))["version"])')
          if git ls-remote --exit-code --tags origin "refs/tags/$TAG"; then
            echo "Version already tagged. Bump the skill version through a PR."
            exit 1
          else
            code=$?
            test "$code" = 2
          fi
          gh release create "$TAG" dist/xiaoyu-ppt.skill dist/manifest.json --repo "$REPO" --target "$SHA" --draft --title "xiaoyu-ppt $TAG" --notes "Built from tested main commit $SHA. Verify manifest.json and inspect preview artifacts before publishing."
